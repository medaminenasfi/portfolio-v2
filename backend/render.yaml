services:
  # Backend API Service
  - type: web
    name: portfolio-backend
    env: node
    plan: free
    runtime: node-20
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_NAME
        value: portfolio-api
      - key: APP_PORT
        value: 10000

  # PostgreSQL Database
  - type: pserv
    name: portfolio-db
    plan: free
    databaseName: portfolio
    user: portfolio_user
